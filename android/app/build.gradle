plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.photoking.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.photoking.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 21
        targetSdkVersion 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        setProperty("archivesBaseName", "zpw_" + versionName)
        manifestPlaceholders = [CHANNEL_VALUE: ""]

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    signingConfigs {
        release {
            storeFile file('photoaiking.jks')
            storePassword '123456'
            keyAlias 'photoaiking'
            keyPassword '123456'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            minifyEnabled false //删除无用代码
            zipAlignEnabled false    //代码压缩设置
            shrinkResources false //删除无用资源

        }
        debug {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
        release {
            manifestPlaceholders = [applicationName: "android.app.Application"]
        }

        debug {
            manifestPlaceholders = [applicationName: "android.app.Application"]
        }

        build {
            manifestPlaceholders = [applicationName: "android.app.Application"]
        }
    }
    flavorDimensions "version"
    productFlavors {
        AIJL300 {
            dimension "version"
            applicationId "com.photoking.app"
            manifestPlaceholders = [CHANNEL_VALUE: "AIJL300",]
            resValue "mipmap", "app_logo", "@mipmap/logo"
        }
    }
    // 配置打包输出文件名
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def flavorName = variant.flavorName // product flavor 名称
            def versionName = variant.versionName // 版本名
            def versionCode = variant.versionCode // 版本号
            def buildType = variant.buildType.name // 构建类型
            def applicationId = variant.applicationId
            // 输出文件名格式：渠道名_版本名_版本号_构建类型.apk
            def fileName = "zpw_(${versionName})_[${applicationId}]_${versionCode}_${buildType}.apk"
            // def fileName = "zpw_${flavorName}_(${versionName})_[${applicationId}]_${versionCode}_${buildType}.apk"
            output.outputFileName = new File(fileName)
        }
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.umeng.umsdk:common:9.4.7'// 必选
    implementation 'com.umeng.umsdk:asms:1.4.0'// 必选
    implementation 'com.meituan.android.walle:library:1.1.7'
    implementation "com.blankj:utilcode:1.23.7"
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    api 'jp.wasabeef:glide-transformations:4.3.0'
    //Glide支持webp动图的库
    implementation "com.github.zjupure:webpdecoder:2.3.4.13.2"
    // Applog 上报组件（必须）
    implementation 'com.bytedance.applog:RangersAppLog-Lite-cn:6.16.9'
// 商业化转化组件（必须）
    implementation 'com.bytedance.ads:AppConvert:1.3.2.1'
}